services:
  nginx:
    image: nginx:latest
    container_name: saas_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_php
    command: sh -c "mkdir -p /var/www/html/uploads/profile && chmod -R 0777 /var/www/html/uploads && if [ ! -f /var/www/html/vendor/autoload.php ]; then composer install --working-dir=/var/www/html --no-interaction --prefer-dist; fi && php-fpm"
    volumes:
      - ./backend:/var/www/html

  mysql:
    image: mysql:8.0
    container_name: saas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: saas_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data:
    external: true
    name: saas-books_db_data
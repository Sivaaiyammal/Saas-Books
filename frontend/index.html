    body {

    /* Custom scrollbar for premium feel */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {

    }

    @media print {
      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }
    }
  </style>
